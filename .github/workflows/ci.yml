name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Git identity for tests that commit
        run: |
          git config --global user.name "Forewright CI"
          git config --global user.email "ci@forewright.invalid"
          git config --global init.defaultBranch main
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
