name: windows probe (temporary)

on:
  push:
    branches: [windows-support]

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Start time readers
        shell: pwsh
        run: |
          @'
          const { spawn, execFileSync } = require("node:child_process");
          const path = require("node:path");
          const child = spawn(process.execPath, ["-e", "setTimeout(()=>{}, 60000)"], { windowsHide: true, stdio: "ignore" });
          const pid = child.pid;
          const ps = path.join(process.env.SystemRoot, "System32", "WindowsPowerShell", "v1.0", "powershell.exe");
          const tries = {
            getProcess: [ps, ["-NoProfile", "-NonInteractive", "-Command", `(Get-Process -Id ${pid}).StartTime.ToUniversalTime().ToString('o')`]],
            cim: [ps, ["-NoProfile", "-NonInteractive", "-Command", `(Get-CimInstance Win32_Process -Filter "ProcessId=${pid}").CreationDate.ToUniversalTime().ToString('o')`]],
          };
          for (const [name, [bin, args]] of Object.entries(tries)) {
            const t0 = Date.now();
            try {
              const out = execFileSync(bin, args, { encoding: "utf8", stdio: ["ignore", "pipe", "pipe"], windowsHide: true, timeout: 20000 });
              console.log(name, "OK", JSON.stringify(out.trim()), `${Date.now() - t0}ms`);
            } catch (e) {
              console.log(name, "FAIL", `${Date.now() - t0}ms`, e.code, e.signal, JSON.stringify(String(e.stderr || "").slice(0, 600)), JSON.stringify(String(e.stdout || "").slice(0, 300)), e.message.slice(0, 300));
            }
          }
          child.kill();
          '@ | Set-Content probe.cjs
          node probe.cjs
