[package]
name = "forewright-desktop"
version = "0.1.0"
description = "Forewright desktop shell"
edition = "2021"
rust-version = "1.77"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-notification = "=2.8.0"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-opener = "=2.7.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
